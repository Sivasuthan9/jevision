# Models used in the experiments. Scripts accept these short names (or any Hugging Face id / local path).
# Revisions are the snapshots used on the main experiment machine.
models:
  h2o-lightning-4b:
    repo: h2oai/h2o-lightning-4b
    revision: b43f759b6385d21182f87c3829931ec3d4dfa98a
    note: Jev-style decision model, LoRA fine-tune of Qwen3.5-4B on text decisions (vision encoder frozen), merged weights.

  qwen3.5-4b:
    repo: Qwen/Qwen3.5-4B
    revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
    note: Base model of H2O-Lightning-4B (32 layers, hybrid attention + Gated DeltaNet).

  qwen3-vl-4b:
    repo: Qwen/Qwen3-VL-4B-Instruct
    revision: ebb281ec70b05090aa6165b016eac8ec08e71b17
    note: Base model of Visual-Jev-4B (36 layers, pure attention, DeepStack vision injection).

  visual-jev-4b:
    repo: Qwen/Qwen3-VL-4B-Instruct
    revision: ebb281ec70b05090aa6165b016eac8ec08e71b17
    adapter: guanxuyu/visual-jev-4b-answer-sft
    adapter_revision: 7a3f1bb0d8f7bfbbd8514d968ab7de3518849c8d
    note: Jev-style decision model (arXiv 2609.25845); its LoRA adapter is merged into the base weights at load time.
