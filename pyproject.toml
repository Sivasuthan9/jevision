[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevision"
version = "0.1.0"
description = "Where and how Jev-style vision decision models read the image: synthetic stimuli, readout probes and counterfactual cache patching."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sivasuthan" }]
dependencies = [
    "torch>=2.4",
    "transformers>=5.16",
    "huggingface_hub>=0.30",
    "safetensors>=0.4",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pillow>=10.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
